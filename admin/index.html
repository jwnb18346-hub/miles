<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MILES — 本机内容管理</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px/1.7 Arial,'PingFang SC',sans-serif;max-width:900px;margin:auto;padding:40px 24px;background:#0a0a0a;color:#f1eec0}h1{font-size:38px;line-height:1.2}h2{font-size:24px}p{color:#b3b19a}a{color:#35a5d2}label{display:block;margin:18px 0 6px}input,textarea{display:block;width:100%;background:#171717;color:#f1eec0;border:1px solid #555;padding:12px;font:inherit;border-radius:3px}textarea{min-height:120px;resize:vertical}input:focus,textarea:focus{outline:2px solid #35a5d2}button{background:#f1eec0;color:#0a0a0a;font:inherit;border:0;border-radius:28px;padding:12px 24px;min-height:48px;cursor:pointer}button:disabled{opacity:.4}section{padding:20px 0 35px;border-bottom:1px solid #333}.actions{position:sticky;bottom:0;padding:20px 0;background:#0a0a0a;display:flex;gap:20px;align-items:center}#status{font-size:14px}details{margin-top:24px}summary{cursor:pointer;min-height:48px;padding:10px 0}input,textarea{max-width:100%}</style><header><a href="/">← 预览网站</a><h1>MILES / 内容管理</h1><p>在这台电脑上编辑站点名称、介绍与项目文案。原视频、图片、项目顺序和规格受保护。保存会更新本机预览；线上发布需要另行提交到 GitHub。</p></header><form id="editor"><div id="fields"><p>正在加载内容…</p></div><div class="actions"><button type="submit" id="save" disabled>保存并更新预览</button><span id="status" role="status" aria-live="polite"></span></div></form><script>
let data,token;const fields=document.querySelector('#fields'),save=document.querySelector('#save'),status=document.querySelector('#status');
const field=(label,value,key,multi=false)=>{const wrapper=document.createElement('div'),l=document.createElement('label'),input=document.createElement(multi?'textarea':'input');input.id=key;input.name=key;input.value=value;input.required=true;input.maxLength=1200;l.htmlFor=key;l.textContent=label;wrapper.append(l,input);return wrapper};
async function load(){try{const [c,s]=await Promise.all([fetch('/api/content'),fetch('/api/session')]);if(!c.ok||!s.ok)throw Error('请用 node server.mjs 启动本机后台后访问此页。');data=await c.json();token=(await s.json()).token;fields.replaceChildren();const intro=document.createElement('section');intro.append(field('站点名称',data.name,'name'),field('中文介绍',data.intro,'intro',true),field('英文介绍',data.enIntro,'enIntro',true));fields.append(intro);data.projects.forEach((p,i)=>{const section=document.createElement('section'),heading=document.createElement('h2');heading.textContent=String(i+1).padStart(2,'0')+' / '+p.title;section.append(heading);[['title','中文标题',false],['enTitle','英文标题',false],['description','中文说明',true],['enDescription','英文说明',true]].forEach(([key,label,multi])=>section.append(field(label,p[key],i+'-'+key,multi)));fields.append(section)});save.disabled=false}catch(e){fields.textContent=e.message;status.textContent='后台未连接。'}}
document.querySelector('#editor').addEventListener('submit',async e=>{e.preventDefault();if(!data)return;save.disabled=true;status.textContent='正在保存…';const next=structuredClone(data);['name','intro','enIntro'].forEach(k=>next[k]=document.getElementById(k).value);next.projects.forEach((p,i)=>['title','enTitle','description','enDescription'].forEach(k=>p[k]=document.getElementById(i+'-'+k).value));try{const r=await fetch('/api/content',{method:'PUT',headers:{'Content-Type':'application/json','X-Miles-Token':token},body:JSON.stringify(next)}),result=await r.json();if(!r.ok)throw Error(result.error||'保存失败');data=next;status.textContent=result.message}catch(e){status.textContent=e.message}finally{save.disabled=false}});load();
</script></html>
